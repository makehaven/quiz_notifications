name: Quiz Notifications
type: module
description: 'MakeHaven behaviour on top of the Quiz module: custom emails when a quiz is passed with 100%, and a taking flow that only stops for feedback when an answer was wrong.'
package: Makerspace
core_version_requirement: ^10 || ^11
dependencies:
  - drupal:quiz
  - drupal:token
configure: quiz_notifications.settings_form